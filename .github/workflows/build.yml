# Tests satmap and builds it for Windows, Linux and macOS on every push and
# pull request (download it from the run's Artifacts). Pushing a tag such
# as v0.1.0 also publishes the builds as a release.
name: Build satmap

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build
        run: |
          for t in windows/amd64 linux/amd64 darwin/arm64 darwin/amd64; do
            os=${t%/*} arch=${t#*/} ext=; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "satmap-$os-$arch$ext" .
          done
      - uses: actions/upload-artifact@v7
        with:
          name: satmap
          path: satmap-*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" satmap-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" satmap-* --title "$GITHUB_REF_NAME" --verify-tag \
              --notes "satmap, ready to run. The map pictures it makes come from your own game files: don't share or publish them."
          fi
